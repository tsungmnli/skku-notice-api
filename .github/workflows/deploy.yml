name: ci-cd

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: tsungmn/skku-notice-api
  CONFIG_REPO: tsungmn/skku-notice-infra
  CONFIG_DIR: config/overlays/api

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          # The DB tests create and drop throwaway databases, so this role needs CREATE DATABASE.
          POSTGRES_USER: skku
          POSTGRES_PASSWORD: dev
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U skku"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      REQUIRE_DB: "1" # a missing database fails the run instead of skipping tests
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q

  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-skku-notice-api
      cancel-in-progress: false # never abandon a half-finished tag bump
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: tsungmn
          password: ${{ secrets.DOCKER_PASSWORD }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      # Argo CD watches the config repo; changing the image tag there is the deploy.
      # CONFIG_REPO_TOKEN: fine-grained PAT, repo = skku-notice-infra only, Contents: Read and write.
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.CONFIG_REPO }}
          token: ${{ secrets.CONFIG_REPO_TOKEN }}
          path: config

      - name: Set the new image tag
        working-directory: config/${{ env.CONFIG_DIR }}
        run: kustomize edit set image "${IMAGE}=${IMAGE}:${GITHUB_SHA}"

      - name: Commit and push (retry if another push landed first)
        working-directory: config
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${CONFIG_DIR}/kustomization.yaml"
          if git diff --cached --quiet; then
            echo "tag already up to date"
            exit 0
          fi
          git commit -m "skku-notice-api: ${GITHUB_SHA::7}"
          for attempt in 1 2 3; do
            git push && exit 0
            git pull --rebase
          done
          exit 1
